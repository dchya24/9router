services:
  9router:
    image: ghcr.io/dchya24/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOST: "0.0.0.0"

volumes:
  9router-data:
    name: 9router-data
